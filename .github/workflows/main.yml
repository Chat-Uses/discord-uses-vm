name: Nuitka compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # Linux requires an external C compiler and python-dev headers
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # Nuitka automatically downloads required C++ compilers on Windows/macOS
    - name: Nuitka compilation 1
      run: |
        python -m nuitka --standalone --onefile your_script.py
      shell: bash

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-binary-${{ matrix.os }}
        path: |
          your_script.bin
          your_script.exe
          your_script
        if-no-files-found: ignore
